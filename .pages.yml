          label: English · 英文
          type: string
          required: false
        - name: zh
          label: 中文
          type: string
          required: false
      - name: short
        label: 分类简称
        type: object
        fields:
        - name: en
          label: English · 英文
          type: string
          required: false
        - name: zh
          label: 中文
          type: string
          required: false
      - name: description
        label: 分类简介
        type: object
        fields:
        - name: en
          label: English · 英文
          type: text
          required: false
        - name: zh
          label: 中文
          type: text
          required: false
      - name: cover
        label: 分类展示图片
        type: image
        options:
          media: images
          path: images/products
          rename: random
        required: false
    - name: mdf
      label: 密度板
      type: object
      fields:
