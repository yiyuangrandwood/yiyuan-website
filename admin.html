<span class="eyebrow">YIYUAN WOOD</span><h1>管理产品，从这里开始。</h1>
<p class="cms-lead">新增产品、上传图片、修改文案。保存后，网站会按已确认的发布设置更新。</p>
<a class="button button-dark" href="https://app.pagescms.org/" target="_blank" rel="noopener noreferrer">登录产品后台 ↗</a>
<section class="cms-steps"><article><span>01</span><h2>选择产品</h2><p>进入已授权的网站，在“产品管理”中新增产品或打开已有产品。</p></article>
<article><span>02</span><h2>填写与上传</h2><p>上传主图和细节图，填写中英文名称、介绍及规格。</p></article>
<article><span>03</span><h2>上架与保存</h2><p>勾选“上架到网站”并保存。需要下架时，取消勾选后保存。</p></article></section>
<aside class="cms-note">首次使用需由网站负责人授权仓库并开启自动发布。登录后只会看到你有权限编辑的网站。</aside>
