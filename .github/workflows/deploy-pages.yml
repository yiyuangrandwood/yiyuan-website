name: 发布沂源网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取网站文件
        uses: actions/checkout@v4
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查发布流程
        run: node --test tests/*.test.mjs
      - name: 生成最新网站
        run: node scripts/build.mjs
      - name: 打包网站
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
